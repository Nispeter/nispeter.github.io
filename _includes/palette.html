{%- comment -%} Command palette shell. Inert until ui.js wires it up (.has-ui gate in CSS). {%- endcomment -%}
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search the site" hidden>
  <div class="palette__panel" role="document">
    <div class="palette__head">
      <svg class="ico-search ico-search--lg" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.7 12.7 17 17"/></svg>
      <input type="text" class="palette__input" id="palette-input" autocomplete="off" spellcheck="false"
             placeholder="Search projects, sections, tech…"
             role="combobox" aria-expanded="true" aria-controls="palette-results" aria-autocomplete="list">
    </div>
    <ul class="palette__results" id="palette-results" role="listbox" aria-label="Results"></ul>
    <p class="palette__empty" id="palette-empty" hidden>No results.</p>
    <div class="palette__foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>
