<header class="masthead">
  <div class="masthead__inner">
    <a class="masthead__brand" href="{{ '/' | relative_url }}">
      <span class="masthead__mark" aria-hidden="true">◐</span>
      <span class="masthead__title">{{ site.title }}</span>
    </a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
    <label for="nav-toggle" class="nav-burger" aria-label="Menu">
      <span></span><span></span><span></span>
    </label>

    <nav class="masthead__nav" aria-label="Primary">
      {% for item in site.data.navigation.main %}
        {% assign is_active = false %}
        {% if item.url == '/' and page.url == '/' %}{% assign is_active = true %}
        {% elsif item.url != '/' and page.url contains item.url %}{% assign is_active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if is_active %} class="is-active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
